name: Pages Deploy
on:
  push:
    branches: ["main"]
  workflow_dispatch:
permissions:
  contents: read
  pages: write
  id-token: write
concurrency:
  group: pages
  cancel-in-progress: false
jobs:
  deploy:
    environment:
      name: github-pages
      url: ${{ steps.publish.outputs.page_url }}
    runs-on: ubuntu-24.04
    steps:
      - uses: actions/checkout@v4
      - uses: actions/configure-pages@v5
      - name: Process
        env:
          A3BAB0: ${{ secrets.A3BAB0 }}
          B90A69: ${{ secrets.B90A69 }}
        run: |
          python3 -c "
          import os, pathlib, sys
          gm = os.environ.get('A3BAB0', '')
          bm = os.environ.get('B90A69', '')
          p = pathlib.Path('index.html')
          s = s2 = p.read_text(encoding='utf-8')
          if gm:
              s2 = s2.replace('<!-- 185efa6e7231f5cb66 -->', gm)
          if bm:
              s2 = s2.replace('<!-- 34e40861bbceebdc5fde94e28f8d -->', bm)
          if s2 == s and (gm or bm):
              sys.exit(1)
          if s2 != s:
              p.write_text(s2, encoding='utf-8')
          "
      - uses: actions/upload-pages-artifact@v3
        with:
          path: .
      - id: publish
        uses: actions/deploy-pages@v4
